name: GoyTeam APK CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish debug APK (GoyTeam)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The old "tools" meta-package no longer exists in the SDK repository; asking for it
          # makes the action fail. platform-tools is all we need from it here.
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Verify vendored library hashes
        working-directory: app/libs
        run: sha256sum -c SHA256SUMS

      - name: Verify debug signing certificate
        run: |
          keytool -list -keystore keystore/debug.keystore -storepass android -alias goyteam-debug \
            | grep -E "goyteam-debug|PrivateKeyEntry"

      - name: Run unit tests (engine core)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Package as GoyTeam debug APK
        run: |
          VERSION=$(grep -oE "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          NAME="StudioMobile-GoyTeam-v${VERSION}-debug"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          sha256sum "${NAME}.apk" > "${NAME}.apk.sha256"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${NAME}.apk" | head -5
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload GoyTeam debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.apk.sha256
          if-no-files-found: error

      # Rolling download for every push to main: always the newest debug APK, no login needed.
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Studio Mobile — latest GoyTeam debug APK"
          prerelease: true
          body: |
            **Always the newest debug build from `main`.**

            - Package: `dev.falix.studiomobile`
            - Version: `${{ env.APK_VERSION }}` (versionCode increases every release)
            - APK: `${{ env.APK_NAME }}.apk` (+ `.sha256`)

            Debug APKs are signed with the shared GoyTeam debug certificate that is committed in the
            repository, so installing this over an earlier GoyTeam build **keeps your data and does not
            ask you to uninstall** — just tap the APK file. (A build signed with a different certificate
            still needs one uninstall first.)

            Verify the SHA-256 before installing, and keep backups of your place files.
          files: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.apk.sha256
          fail_on_unmatched_files: true

      # Tagged builds also get a permanent, versioned release next to the rolling one.
      - name: Publish version release (GoyTeam) on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Studio Mobile ${{ github.ref_name }} — GoyTeam debug build"
          body: |
            **Studio Mobile ${{ github.ref_name }} — GoyTeam debug build**

            - Package: `dev.falix.studiomobile`
            - Version: `${{ env.APK_VERSION }}`
            - APK: `${{ env.APK_NAME }}.apk` (+ `.sha256`)
            - Signed with the committed GoyTeam debug certificate: updates install over previous
              GoyTeam debug builds without uninstalling.

            Verify the SHA-256 before installing, and keep backups of your place files.
          files: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.apk.sha256
          fail_on_unmatched_files: true
