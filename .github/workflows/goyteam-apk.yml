name: GoyTeam APK CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package APK (GoyTeam)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare build environment
        run: |
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Verify vendored library hashes
        working-directory: app/libs
        run: sha256sum -c SHA256SUMS

      - name: Run unit tests (engine core)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Package as GoyTeam APK
        run: |
          VERSION=$(grep -oE "versionName '[^']+'" app/build.gradle | head -1 | cut -d"'" -f2)
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          NAME="StudioMobile-GoyTeam-v${VERSION}"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          sha256sum "${NAME}.apk" > "${NAME}.apk.sha256"
          echo "APK_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload GoyTeam APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.apk.sha256
          if-no-files-found: error

      - name: Publish release (GoyTeam) on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Studio Mobile ${{ github.ref_name }} — GoyTeam build"
          body: |
            **Studio Mobile — GoyTeam CI build**

            - Package: `dev.falix.studiomobile`
            - Version: `${{ env.APK_VERSION }}`
            - APK: `${{ env.APK_NAME }}.apk` (+ `.sha256`)
            - Signed with the CI debug keystore. Uninstall an older build before installing this one;
              future releases keep this test signature only if the same keystore is used.

            The APK and checksum are attached below. Verify the SHA-256 before installing.
          files: |
            ${{ env.APK_NAME }}.apk
            ${{ env.APK_NAME }}.apk.sha256
          fail_on_unmatched_files: true
