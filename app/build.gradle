plugins { id 'com.android.application' }
android {
    namespace 'dev.falix.studiomobile'
    compileSdk 35
    defaultConfig { applicationId 'dev.falix.studiomobile'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

// Vendored, pinned networking runtime: available offline and included in the APK.
dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    testImplementation 'junit:junit:4.13.2'
}
