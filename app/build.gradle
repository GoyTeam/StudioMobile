plugins { id 'com.android.application' }
android {
    namespace 'dev.falix.studiomobile'
    compileSdk 35
    defaultConfig { applicationId 'dev.falix.studiomobile'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.4.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }

    // Debug APKs are what CI and local builds publish. They are signed with the committed
    // GoyTeam debug certificate (keystore/debug.keystore, alias goyteam-debug, password android)
    // so every new build installs straight over an existing one without uninstalling.
    // This is a sideload/testing certificate only — never use it for production.
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'goyteam-debug'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }
}

// Vendored, pinned networking runtime: available offline and included in the APK.
dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    testImplementation 'junit:junit:4.13.2'
}
